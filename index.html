<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Layout</title>
<style>
  :root{
    --bg:#EAEFF6; --chrome:#FFFFFF; --panel:#F3F6FA; --panel-2:#E7EDF6; --line:#D9E1EC;
    --text:#141A22; --dim:#6C7A8C; --accent:#2F6BFF; --accent-soft:#E7EDFF;
    --paper:#FFFFFF; --ink:#2A3140; --rule:#E6EAF1; --glass:#3E9BE0; --bad:#E04A3C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font:400 15px/1.5 "Inter","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  .top{display:flex;flex-direction:column;flex:none;background:var(--chrome);border-bottom:1px solid var(--line)}
  .top-row1{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:10px 20px}
  .top-row1 > *{flex:0 0 auto}
  .top-row2{display:flex;align-items:center;gap:10px 18px;padding:7px 20px;border-top:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:4px;white-space:nowrap}
  .brand h1{font-size:15.5px;font-weight:500;margin:0;white-space:nowrap}

  .chips{display:flex;gap:7px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
  .chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;cursor:pointer;flex:0 0 auto;
    border:1.5px solid var(--line);border-radius:999px;background:var(--chrome);
    font-size:13px;user-select:none;white-space:nowrap}
  .chip:hover{background:var(--panel)}
  .chip.cur{border-color:var(--accent);background:var(--accent-soft)}
  .chip.off{color:var(--dim)}
  .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line);
    background:var(--chrome);flex:none;display:grid;place-items:center}
  .box::after{content:"";width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;
    transform:rotate(-45deg) translate(1px,-1px);opacity:0}
  .chip.on .box{background:var(--accent);border-color:var(--accent)}
  .chip.on .box::after{opacity:1}
  .chip .sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(20,26,34,.15)}

  .group{display:flex;align-items:center;gap:8px;white-space:nowrap}

  .tgl.inrow{margin-left:6px;align-self:center}
  .extras{display:flex;align-items:center;gap:13px;white-space:nowrap;
    margin-left:3px;padding-left:11px;border-left:1px solid var(--line)}
  .chip.off .extras{opacity:.45;pointer-events:none}
  #preset{max-width:220px}
  .lead{font-size:12.5px;color:var(--dim)}

  button,select{font:inherit;font-size:12.5px;color:var(--text);background:var(--chrome);
    border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
  button:hover,select:hover{background:var(--panel)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tgl{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;user-select:none;
    color:var(--dim);white-space:nowrap}
  .tgl input{position:absolute;opacity:0;width:0;height:0}
  .track{width:32px;height:18px;border-radius:999px;background:var(--panel-2);
    border:1px solid var(--line);position:relative;transition:background .14s,border-color .14s;flex:none}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(20,30,50,.28);transition:transform .14s}
  .tgl input:checked + .track{background:var(--accent);border-color:var(--accent)}
  .tgl input:checked + .track::after{transform:translateX(14px)}
  .tgl input:checked ~ .tl{color:var(--text)}
  .tgl input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

  .canvas-area{flex:1;min-height:0;min-width:0;display:flex;align-items:center;
    justify-content:center;padding:26px;overflow:hidden}
  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:24px;
    box-shadow:0 10px 30px rgba(30,45,70,.10)}
  #room{position:relative;touch-action:none}
  #grid,#walls{position:absolute;inset:0;pointer-events:none}
  #walls{z-index:6}

  .piece{position:absolute;cursor:grab;touch-action:none;user-select:none;border-radius:2px}
  .piece:active{cursor:grabbing}
  .piece.cur{outline:2px solid var(--accent);outline-offset:2px}
  .piece.clash{box-shadow:0 0 0 2.5px var(--bad)}
  .inner{position:absolute;transform-origin:50% 50%}
  .inner svg{display:block;width:100%;height:100%}
  .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;pointer-events:none;line-height:1.25;padding:1px}
  .lbl b{font-size:11px;font-weight:500}
  .lbl span{font-size:9.5px;opacity:.75;font-family:ui-monospace,Menlo,monospace}
  .piece.tiny .lbl b{font-size:9px}
  .piece.tiny .lbl span{display:none}

  .doorleaf{position:absolute;transform-origin:0 50%;pointer-events:none;z-index:7;
    transition:transform .3s cubic-bezier(.4,0,.2,1)}
  .doorleaf i{display:block;width:100%;height:100%;background:var(--ink);border-radius:1px}

  .foot{flex:none;padding:10px 20px;background:var(--chrome);border-top:1px solid var(--line);
    color:var(--dim);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
  .foot kbd{font:400 11px ui-monospace,Menlo,monospace;border:1px solid var(--line);
    background:var(--panel);border-radius:4px;padding:1px 5px;color:var(--text)}
  .alert{color:var(--bad)}
  .rot-btn{font-size:15px;padding:5px 10px;transition:background .15s,color .15s,border-color .15s}
  .rot-btn:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff}
  .rot-btn:not(:disabled):hover{background:#2159DB;border-color:#2159DB}
  .rot-btn:disabled{color:var(--line);border-color:var(--line);cursor:not-allowed;background:var(--chrome)}

  #view3d{position:absolute;inset:0;z-index:15;display:none;background:#e9edf3;
    border-radius:2px;cursor:grab;touch-action:none}
  #view3d.on{display:block}
  #view3d:active{cursor:grabbing}
  .povs{position:absolute;inset:0;z-index:20;pointer-events:none}
  .pov{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
    border:1.5px solid var(--line);background:var(--chrome);color:var(--dim);
    display:grid;place-items:center;font-size:12px;cursor:pointer;pointer-events:auto;
    box-shadow:0 1px 4px rgba(20,30,50,.20);transition:transform .1s,background .1s}
  .pov:hover{transform:scale(1.15)}
  .pov.on{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="top-row1">
      <div class="brand"><h1>Room Layout</h1></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="top-row2">
      <div class="group">
        <span class="lead">Room</span>
        <select id="roomSize" aria-label="Room size"></select>
      </div>
      <div class="group">
        <span class="lead">Preset</span>
        <select id="preset" aria-label="Preset"></select>
      </div>
    </div>
  </div>

  <div class="canvas-area">
    <div class="sheet"><div id="room"><canvas id="grid"></canvas></div></div>
  </div>

  <div class="foot">
    <span>Drag to move</span>
    <span><kbd>R</kbd> rotate</span>
    <span><kbd>←↑↓→</kbd> nudge an inch, <kbd>Shift</kbd> six</span>
    <span class="alert" id="warn"></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let ROOM_W = 180, ROOM_H = 144;
const DOOR_W = 36;
const DOOR_H = 84, WIN_SILL = 36, WIN_HEAD = 84, CEIL_H = 120, EYE_H = 66;
const ROOM_SIZES = [[15,12],[14,12]];

const DEFS = [
  {id:'bed', name:'Bed', w:88.1, d:89.7, tall:43.7, body:'#E4DACA', ink:'#3A2E22'},
  {id:'almirah', name:'Almirah', w:70.9, d:20.0, tall:94.5, body:'#EFEAE0', ink:'#3A3529'},
  {id:'dresser', name:'Dresser', w:35.4, d:23.6, tall:77.5, body:'#4A3728', ink:'#F2EDE4'},
  {id:'bedside', name:'Bedside', w:17.7, d:17.7, tall:20.4, body:'#7A5539', ink:'#F5EFE6'},
  {id:'chair', name:'Chair', w:24, d:24, tall:36, body:'#8A7B63', ink:'#33302A'},
  {id:'chair2', name:'Chair', w:24, d:24, tall:36, body:'#8A7B63', ink:'#33302A', chip:false},
  {id:'table', name:'Table', w:24, d:24, tall:30, body:'#B99A6B', ink:'#33302A'}
];
const ALMIRAHS = {xl:{w:70.9,d:20.0,tall:94.5}, std:{w:53.1,d:19.9,tall:76.7}};
const DIRS = [[0,1],[-1,0],[0,-1],[1,0]];
// Preset x can be a number (from the left wall) or w => … (computed from the
// current room width) so wall-hugging pieces stay flush at any room size.
const ALM_W = ALMIRAHS.xl.w, DRS_W = 35.4;
// "Storage on one wall" base, shared by the chair-table preset.
const WALL_STORAGE = {bed:[0,55.9,270], almirah:[w=>w-ALM_W,0,0], dresser:[w=>w-ALM_W-DRS_W,0,0], bedside:[0,36,270]};
const PRESETS = {
  chairtable: {...WALL_STORAGE, chair:[w=>w-36,72,0], table:[w=>w-36,96,0], chair2:[w=>w-36,120,180]},
  split:    {bed:[17.7,54.3,180], almirah:[w=>w-ALM_W,0,0], dresser:[105.9,120.4,180],      bedside:[0,126.3,180]},
  together: {...WALL_STORAGE},
  facing:   {bed:[0,55.9,270],    almirah:[w=>w-ALM_W,0,0], dresser:[w=>w-DRS_W,120.4,180],  bedside:[0,36,270]},
  clear:    {bed:[40,40,0],       almirah:[40,0,0],         dresser:[120,0,0],               bedside:[0,0,270]}
};

let scale = 1, doorY = 0, selected = null, doorsOpen = true, doorOpen = true, windowsOpen = true;
const state = {}, els = {}, chipEls = {};
DEFS.forEach(d => state[d.id] = {x:0, y:0, rot:0, on:true});
state.chair.on = false; state.chair2.on = false; state.table.on = false;   // added by hand, never part of a preset

const room = document.getElementById('room');
const grid = document.getElementById('grid');
const chipsEl = document.getElementById('chips');
const warnEl = document.getElementById('warn');

function dims(id){
  const def = DEFS.find(d => d.id === id);
  return state[id].rot % 180 === 0 ? {w:def.w, h:def.d} : {w:def.d, h:def.w};
}
function rect(id){ const s = state[id], m = dims(id); return {x:s.x, y:s.y, w:m.w, h:m.h}; }
function overlap(a,b){
  return a.x < b.x+b.w-.05 && a.x+a.w > b.x+.05 && a.y < b.y+b.h-.05 && a.y+a.h > b.y+.05;
}
function hitsDoor(r){
  if (r.x > DOOR_W) return false;
  const nx = Math.max(r.x, Math.min(0, r.x+r.w));
  const ny = Math.max(r.y, Math.min(doorY, r.y+r.h));
  return Math.hypot(nx, ny-doorY) < DOOR_W && r.y < doorY+DOOR_W && r.y+r.h > doorY-.05;
}
function canPlace(id, x, y, rot){
  const def = DEFS.find(d => d.id === id);
  const m = rot % 180 === 0 ? {w:def.w, h:def.d} : {w:def.d, h:def.w};
  if (x < -.01 || y < -.01 || x+m.w > ROOM_W+.01 || y+m.h > ROOM_H+.01) return false;
  const r = {x, y, w:m.w, h:m.h};
  if (hitsDoor(r)) return false;
  for (const o of DEFS){
    if (o.id === id || !state[o.id].on) continue;
    if (overlap(r, rect(o.id))) return false;
  }
  return true;
}
function tryMove(id, x, y){
  const s = state[id];
  if (canPlace(id, x, y, s.rot)){ s.x = x; s.y = y; return; }
  if (canPlace(id, x, s.y, s.rot)){ s.x = x; return; }
  if (canPlace(id, s.x, y, s.rot)) s.y = y;
}
function findSpot(id, rot){
  for (let y=0; y<=ROOM_H; y+=6)
    for (let x=0; x<=ROOM_W; x+=6)
      if (canPlace(id, x, y, rot)) return {x, y};
  return null;
}
function rotate(id, dir=1){
  const s = state[id], nr = (s.rot + dir*90 + 360)%360;
  if (canPlace(id, s.x, s.y, nr)){ s.rot = nr; render(); return; }
  for (let d=1; d<=24; d++)
    for (const [ox,oy] of [[-d,0],[d,0],[0,-d],[0,d]])
      if (canPlace(id, s.x+ox, s.y+oy, nr)){ s.rot = nr; s.x += ox; s.y += oy; render(); return; }
}

function art(def){
  const W = def.w, D = def.d;
  const open = `<svg viewBox="0 0 ${W} ${D}" preserveAspectRatio="none">`;
  if (def.id === 'bed') return open + `
    <rect x=".4" y=".4" width="${W-.8}" height="${D-.8}" rx="2" fill="#E4DACA" stroke="#3A2E22" stroke-width=".6"/>
    <rect x=".4" y=".4" width="${W-.8}" height="9.5" fill="#D6C9B2"/>
    <rect x="11" y="1.8" width="31" height="6.6" rx="2.4" fill="#9C8B72"/>
    <rect x="46" y="1.8" width="31" height="6.6" rx="2.4" fill="#9C8B72"/>
    <rect x="4" y="11.5" width="${W-8}" height="${D-16}" rx="2" fill="#F7F5F0" stroke="#C9C2B4" stroke-width=".5"/>
    <rect x="9" y="14.5" width="31" height="13" rx="3" fill="#DDD7CB" stroke="#C2BAA9" stroke-width=".4"/>
    <rect x="48" y="14.5" width="31" height="13" rx="3" fill="#DDD7CB" stroke="#C2BAA9" stroke-width=".4"/>
    <path d="M4 47 H${W-4}" stroke="#CFC7B7" stroke-width=".7"/>
    <rect x=".4" y="${D-5}" width="${W-.8}" height="4.6" fill="#D6C9B2" stroke="#3A2E22" stroke-width=".4"/></svg>`;
  if (def.id === 'almirah'){
    const t = W/3, band = D*.17;
    return open + `
    <rect x=".4" y=".4" width="${W-.8}" height="${D-.8}" rx="1" fill="#EFEAE0" stroke="#3A3529" stroke-width=".6"/>
    <path d="M2 ${D*.45} H${W-2}" stroke="#DCD5C8" stroke-width=".5"/>
    <path d="M${t} 2 V${D-band}" stroke="#DCD5C8" stroke-width=".4"/>
    <path d="M${2*t} 2 V${D-band}" stroke="#DCD5C8" stroke-width=".4"/>
    <rect x=".4" y="${D-band-.4}" width="${W-.8}" height="${band}" fill="#C9BFAE" stroke="#3A3529" stroke-width=".5"/>
    <path d="M${t} ${D-band} V${D-.6} M${2*t} ${D-band} V${D-.6}" stroke="#3A3529" stroke-width=".5"/>
    <rect x="${t*.28}" y="${D-band+.7}" width="${t*.44}" height="${band-1.6}" rx=".4" fill="#DCE6EC"/>
    <rect x="${t-2.2}" y="${D-band+.8}" width="1.3" height="${band-2}" rx=".5" fill="#7E786C"/>
    <rect x="${2*t-2.2}" y="${D-band+.8}" width="1.3" height="${band-2}" rx=".5" fill="#7E786C"/></svg>`;
  }
  if (def.id === 'dresser') return open + `
    <rect x=".4" y=".4" width="${W-.8}" height="${D-.8}" rx="1" fill="#4A3728" stroke="#241A12" stroke-width=".6"/>
    <rect x="1.4" y="1.4" width="${W-2.8}" height="${D-2.8}" rx=".6" fill="#573F2D"/>
    <path d="M21.2 1.4 V${D-1.4}" stroke="#33251A" stroke-width=".7"/>
    <path d="M2.6 3 H19.8 M2.6 ${D/2} H19.8 M2.6 ${D-3} H19.8" stroke="#5F4633" stroke-width=".35"/>
    <rect x=".4" y="${D-2.6}" width="20.8" height="2.2" fill="#3B2B1F"/>
    <rect x="21.2" y="${D-2.6}" width="${W-21.6}" height="2.2" fill="#E8DFCF"/>
    <path d="M${W-7.4} ${D-1.5} H${W-3.4}" stroke="#9A917F" stroke-width=".8" stroke-linecap="round"/></svg>`;
  if (def.id === 'chair' || def.id === 'chair2')
    return open + `<rect x="1.4" y="6" width="21.2" height="16.6" rx="3" fill="#8A7B63" stroke="#33302A" stroke-width=".9"/>
      <rect x="1.4" y="1.4" width="21.2" height="6" rx="2.4" fill="#6E6049" stroke="#33302A" stroke-width=".8"/>
      <rect x="4" y="9" width="16" height="11" rx="2" fill="#7C6E58"/></svg>`;
  if (def.id === 'table')
    return open + `<circle cx="${W/2}" cy="${D/2}" r="${W/2-1}" fill="#B99A6B" stroke="#5E4A2E" stroke-width="1"/>
      <circle cx="${W/2}" cy="${D/2}" r="${W/2-4.5}" fill="none" stroke="#9A7C50" stroke-width=".7"/></svg>`;
  return open + `
    <rect x=".4" y=".4" width="${W-.8}" height="${D-.8}" rx="1" fill="#7A5539" stroke="#2E2016" stroke-width=".6"/>
    <rect x="1.8" y="1.8" width="${W-3.6}" height="${D*.62}" rx=".6" fill="#8C6543"/>
    <rect x="1.4" y="${D*.68}" width="${W-2.8}" height="${D*.28}" rx=".6" fill="#E8DFCF" stroke="#B9AE99" stroke-width=".4"/>
    <rect x="${W/2-2.6}" y="${D*.79}" width="5.2" height="1" rx=".5" fill="#9A917F"/></svg>`;
}

DEFS.forEach(def => {
  const el = document.createElement('div');
  el.className = 'piece'; el.tabIndex = 0;
  el.innerHTML = `<div class="inner">${art(def)}</div>
    <div class="lbl" style="color:${def.ink}"><b>${def.name}</b><span></span></div>`;
  el.addEventListener('pointerdown', e => startDrag(e, def.id));
  room.appendChild(el); els[def.id] = el;

  const c = document.createElement('div');
  c.className = 'chip on';
  c.innerHTML = `<span class="box"></span><span class="sw" style="background:${def.body}"></span>${def.name}` +
    (def.id === 'almirah' ? `<span class="extras">
      <label class="tgl"><input type="checkbox" id="xl" checked><span class="track"></span><span class="tl">XL</span></label>
      <label class="tgl"><input type="checkbox" id="swing" checked><span class="track"></span><span class="tl">Doors open</span></label>
    </span>` : '') +
    (def.id === 'chair' ? `<span class="extras"><label>Count
      <select id="chairCount"><option value="1">1</option><option value="2">2</option></select></label></span>` : '');
  c.addEventListener('click', e => {
    if (e.target.closest('.extras')) return;
    if (e.target.classList.contains('box')) toggleOn(def.id);
    else if (state[def.id].on){ selected = def.id; render(); }
    else toggleOn(def.id);
  });
  chipEls[def.id] = c;
  if (def.chip !== false) chipsEl.appendChild(c);
});

const doorTgl = document.createElement('label');
doorTgl.className = 'tgl inrow';
doorTgl.innerHTML = '<input type="checkbox" id="roomdoor" checked>'
  + '<span class="track"></span><span class="tl">Door open</span>';

const windowTgl = document.createElement('label');
windowTgl.className = 'tgl inrow';
windowTgl.innerHTML = '<input type="checkbox" id="roomwindow" checked>'
  + '<span class="track"></span><span class="tl">Window open</span>';

const endGroup = document.createElement('div');
endGroup.className = 'group';
endGroup.innerHTML = '<button id="rotCCW" class="rot-btn" title="Rotate counter-clockwise" disabled>↺</button>'
  + '<button id="rotCW" class="rot-btn" title="Rotate clockwise" disabled>↻</button>';
endGroup.prepend(windowTgl);
endGroup.prepend(doorTgl);
chipsEl.appendChild(endGroup);

const doorLeaf = document.createElement('div');
doorLeaf.className = 'doorleaf';
doorLeaf.innerHTML = '<i></i>';
room.appendChild(doorLeaf);

const walls = document.createElement('canvas');
walls.id = 'walls';
room.appendChild(walls);

function toggleOn(id){
  const s = state[id];
  if (!s.on && !canPlace(id, s.x, s.y, s.rot)){
    const spot = findSpot(id, s.rot);
    if (!spot) return;
    s.x = spot.x; s.y = spot.y;
  }
  s.on = !s.on;
  if (!s.on && selected === id) selected = null;
  if (s.on) selected = id;
  if (id === 'chair') syncChair2();
  render();
}

// The Chair "Count" dropdown adds/removes a second, independent chair piece.
function syncChair2(){
  const want = state.chair.on && document.getElementById('chairCount').value === '2';
  const c = state.chair, c2 = state.chair2;
  if (want && !c2.on){
    c2.rot = c.rot;
    const near = [[c.x+26,c.y],[c.x-26,c.y],[c.x,c.y+26],[c.x,c.y-26]]
      .find(([x,y]) => canPlace('chair2', x, y, c2.rot));
    if (near){ c2.x = near[0]; c2.y = near[1]; }
    else { const sp = findSpot('chair2', c2.rot); if (sp){ c2.x = sp.x; c2.y = sp.y; } }
  }
  c2.on = want;
  if (!c2.on && selected === 'chair2') selected = null;
}

function drawBoard(){
  const dpr = devicePixelRatio || 1, w = ROOM_W*scale, h = ROOM_H*scale;
  grid.width = w*dpr; grid.height = h*dpr;
  grid.style.width = w+'px'; grid.style.height = h+'px';
  const ctx = grid.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
  const S = v => v*scale;

  ctx.strokeStyle = css('--rule'); ctx.lineWidth = 1;
  for (let i=12;i<ROOM_W;i+=12){ ctx.beginPath(); ctx.moveTo(Math.round(S(i))+.5,0); ctx.lineTo(Math.round(S(i))+.5,h); ctx.stroke(); }
  for (let j=12;j<ROOM_H;j+=12){ ctx.beginPath(); ctx.moveTo(0,Math.round(S(j))+.5); ctx.lineTo(w,Math.round(S(j))+.5); ctx.stroke(); }

  if (doorOpen){
    ctx.strokeStyle = '#98A2B2'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(1.5,S(doorY),S(DOOR_W),0,Math.PI/2); ctx.stroke();
    ctx.setLineDash([]);
  }

  if (doorsOpen && state.almirah.on) drawSwing(ctx, S);
}

// Walls draw on their own canvas above the furniture, so a piece pushed
// flush to a wall tucks behind the wall line instead of covering it.
function drawWalls(){
  const dpr = devicePixelRatio || 1, w = ROOM_W*scale, h = ROOM_H*scale;
  walls.width = w*dpr; walls.height = h*dpr;
  walls.style.width = w+'px'; walls.style.height = h+'px';
  const ctx = walls.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
  const S = v => v*scale;

  ctx.strokeStyle = css('--ink'); ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(1.5,1.5); ctx.lineTo(w-1.5,1.5); ctx.lineTo(w-1.5,h-1.5); ctx.lineTo(1.5,h-1.5); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(1.5,1.5); ctx.lineTo(1.5,S(doorY));
  ctx.moveTo(1.5,S(doorY+DOOR_W)); ctx.lineTo(1.5,h-1.5); ctx.stroke();

  ctx.strokeStyle = css('--glass'); ctx.lineWidth = 5;
  for (const s of windowSpecs()){
    const wx = s.wall === 'L' ? 2.5 : w-2.5;
    ctx.beginPath(); ctx.moveTo(wx,S(s.a0)); ctx.lineTo(wx,S(s.a1)); ctx.stroke();
  }
  if (windowsOpen) for (const s of windowSpecs())
    windowVents(ctx, S, s.wall === 'L' ? 2.5 : w-2.5, s.a0, s.a1-s.a0, s.wall === 'L' ? 1 : -1, s.pairs);
}

// A window is a row of hinged pairs. Each pair is two sashes that swing
// inward to meet at the pair's centre; a 2" wooden post sits between pairs.
const WIN_POST = 2;
function windowSpecs(){
  const wt = Math.min(doorY+DOOR_W, ROOM_H-24);
  return [
    {wall:'L', a0:wt, a1:wt+24, pairs:1},
    {wall:'R', a0:9,  a1:135,   pairs:4},
  ];
}
function windowVents(ctx, S, wallX, y0, len, dir, pairs){
  const pairW = (len - (pairs-1)*WIN_POST)/pairs, sashW = pairW/2;
  const arc = (cx,cy,r,a,b) => {
    let d=b-a; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    ctx.beginPath();
    for (let k=0;k<=12;k++){ const t=a+d*k/12; (k?ctx.lineTo:ctx.moveTo).call(ctx, cx+Math.cos(t)*r, cy+Math.sin(t)*r); }
    ctx.stroke();
  };
  for (let i=0;i<pairs;i++){
    const p0 = y0 + i*(pairW+WIN_POST);
    for (const [hy,closed] of [[p0, Math.PI/2],[p0+pairW, -Math.PI/2]]){
      const open = dir>0 ? 0 : Math.PI;
      ctx.strokeStyle = '#98A2B2'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      arc(wallX, S(hy), S(sashW), open, closed);
      ctx.setLineDash([]);
      ctx.strokeStyle = '#7C5A34'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(wallX, S(hy)); ctx.lineTo(wallX + Math.cos(open)*S(sashW), S(hy) + Math.sin(open)*S(sashW));
      ctx.stroke(); ctx.lineCap = 'butt';
    }
    if (i < pairs-1){
      ctx.fillStyle = '#8A6A3F';
      ctx.fillRect(wallX - (dir>0?0:3), S(p0+pairW) - 1, 3, S(WIN_POST) + 2);
    }
  }
}

function drawSwing(ctx, S){
  const r = rect('almirah'), [dx,dy] = DIRS[state.almirah.rot/90];
  const faceLen = dy !== 0 ? r.w : r.h, dw = faceLen/3;
  let ox, oy, ux, uy;
  if (dy === 1)       { ox=r.x;     oy=r.y+r.h; ux= 1; uy= 0; }
  else if (dy === -1) { ox=r.x+r.w; oy=r.y;     ux=-1; uy= 0; }
  else if (dx === 1)  { ox=r.x+r.w; oy=r.y;     ux= 0; uy= 1; }
  else                { ox=r.x;     oy=r.y+r.h; ux= 0; uy=-1; }

  for (const d of [{t:0,dir:1},{t:dw,dir:1},{t:3*dw,dir:-1}]){
    const hx = ox+ux*d.t, hy = oy+uy*d.t;
    const tx = hx+dx*dw,  ty = hy+dy*dw;
    const fx = ox+ux*(d.t+d.dir*dw), fy = oy+uy*(d.t+d.dir*dw);
    let a1 = Math.atan2(ty-hy, tx-hx), a2 = Math.atan2(fy-hy, fx-hx), da = a2-a1;
    while (da >  Math.PI) da -= 2*Math.PI;
    while (da < -Math.PI) da += 2*Math.PI;
    ctx.strokeStyle = '#98A2B2'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
    ctx.beginPath();
    for (let i=0;i<=16;i++){
      const a = a1+da*i/16;
      const px = S(hx+Math.cos(a)*dw), py = S(hy+Math.sin(a)*dw);
      i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
    }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = '#2A3140'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(S(hx),S(hy)); ctx.lineTo(S(tx),S(ty)); ctx.stroke();
    ctx.lineCap = 'butt';
  }
}

function render(){
  drawBoard();
  drawWalls();
  const live = DEFS.filter(d => state[d.id].on);
  const clash = new Set();
  for (let i=0;i<live.length;i++){
    for (let j=i+1;j<live.length;j++)
      if (overlap(rect(live[i].id), rect(live[j].id))){ clash.add(live[i].id); clash.add(live[j].id); }
    if (hitsDoor(rect(live[i].id))) clash.add(live[i].id);
  }

  DEFS.forEach(def => {
    const s = state[def.id], m = dims(def.id), el = els[def.id], c = chipEls[def.id];
    c.classList.toggle('on', s.on);
    c.classList.toggle('off', !s.on);
    c.classList.toggle('cur', selected === def.id && s.on);
    el.style.display = s.on ? 'block' : 'none';
    if (!s.on) return;

    el.style.left = s.x*scale+'px'; el.style.top = s.y*scale+'px';
    el.style.width = m.w*scale+'px'; el.style.height = m.h*scale+'px';
    el.classList.toggle('clash', clash.has(def.id));
    el.classList.toggle('cur', selected === def.id);
    el.classList.toggle('tiny', m.w*scale < 78 || m.h*scale < 32);
    el.querySelector('.lbl span').textContent =
      `${m.w.toFixed(1)} × ${m.h.toFixed(1)} × ${def.tall.toFixed(0)}\u2033`;

    const inner = el.querySelector('.inner');
    inner.style.width = def.w*scale+'px'; inner.style.height = def.d*scale+'px';
    inner.style.left = (m.w-def.w)/2*scale+'px'; inner.style.top = (m.h-def.d)/2*scale+'px';
    inner.style.transform = `rotate(${s.rot}deg)`;
  });

  doorLeaf.style.left = '0px';
  doorLeaf.style.top = (doorY*scale - 1.5) + 'px';
  doorLeaf.style.width = DOOR_W*scale + 'px';
  doorLeaf.style.height = '3px';
  doorLeaf.style.transform = `rotate(${doorOpen ? 0 : 90}deg)`;
  warnEl.textContent = clash.size ? 'That spot is taken' : '';
  const hasSelected = selected && state[selected].on;
  document.getElementById('rotCCW').disabled = !hasSelected;
  document.getElementById('rotCW').disabled = !hasSelected;
  V3.refresh();
}

let drag = null;
function startDrag(e,id){
  e.preventDefault(); selected = id; render();
  els[id].setPointerCapture(e.pointerId);
  const r = room.getBoundingClientRect();
  drag = {id, dx:(e.clientX-r.left)/scale - state[id].x, dy:(e.clientY-r.top)/scale - state[id].y};
  els[id].addEventListener('pointermove', onDrag);
  els[id].addEventListener('pointerup', endDrag);
  els[id].addEventListener('pointercancel', endDrag);
}
function onDrag(e){
  if (!drag) return;
  const r = room.getBoundingClientRect(), m = dims(drag.id);
  const snap = v => { const n = Math.round(v); return Math.abs(v-n) < .6 ? n : v; };
  let x = snap((e.clientX-r.left)/scale - drag.dx);
  let y = snap((e.clientY-r.top)/scale - drag.dy);
  if (x < 2) x = 0;
  if (y < 2) y = 0;
  if (x+m.w > ROOM_W-2) x = ROOM_W-m.w;
  if (y+m.h > ROOM_H-2) y = ROOM_H-m.h;
  x = Math.max(0, Math.min(ROOM_W-m.w, x));
  y = Math.max(0, Math.min(ROOM_H-m.h, y));
  tryMove(drag.id, x, y); render();
}
function endDrag(){
  if (!drag) return;
  const el = els[drag.id];
  el.removeEventListener('pointermove', onDrag);
  el.removeEventListener('pointerup', endDrag);
  el.removeEventListener('pointercancel', endDrag);
  drag = null;
}

addEventListener('keydown', e => {
  if (!selected || !state[selected].on) return;
  const s = state[selected], step = e.shiftKey ? 6 : 1, k = e.key;
  if (k === 'r' || k === 'R') rotate(selected);
  else if (k === 'ArrowLeft')  tryMove(selected, s.x-step, s.y);
  else if (k === 'ArrowRight') tryMove(selected, s.x+step, s.y);
  else if (k === 'ArrowUp')    tryMove(selected, s.x, s.y-step);
  else if (k === 'ArrowDown')  tryMove(selected, s.x, s.y+step);
  else return;
  e.preventDefault(); render();
});

document.getElementById('rotCW').addEventListener('click', () => { if (selected) rotate(selected, 1); });
document.getElementById('rotCCW').addEventListener('click', () => { if (selected) rotate(selected, -1); });

const presetSel = document.getElementById('preset');

function apply(snap){
  doorY = snap.doorY || 0;
  if (snap.open !== undefined){
    doorOpen = !!snap.open;
    document.getElementById('roomdoor').checked = doorOpen;
  }
  windowsOpen = false;   // presets start with the windows closed
  document.getElementById('roomwindow').checked = false;
  const xlBox = document.getElementById('xl');
  if (xlBox.checked !== !!snap.xl){
    xlBox.checked = !!snap.xl;
    xlBox.dispatchEvent(new Event('change'));
  }
  DEFS.forEach(d => Object.assign(state[d.id], snap.pieces[d.id]));
  document.getElementById('chairCount').value = state.chair2.on ? '2' : '1';
  selected = null;
  render();
}
function fromPreset(p, key){
  const pieces = {};
  DEFS.forEach(d => {
    const v = p[d.id];
    if (!v){ pieces[d.id] = {...state[d.id], on:false}; return; }   // chair/table: no preset ever places them
    const x = typeof v[0] === 'function' ? v[0](ROOM_W) : v[0];
    pieces[d.id] = {x, y:v[1], rot:v[2], on:key !== 'clear'};
  });
  return {doorY:0, xl:true, pieces};
}

[['chairtable','Chair table'],['facing','Bed on the door wall'],['split','Dresser on the bed wall'],
 ['together','Storage on one wall'],['clear','Empty floor']]

presetSel.addEventListener('change', () => {

const roomSizeSel = document.getElementById('roomSize');
ROOM_SIZES.forEach(([w,h],i) => roomSizeSel.appendChild(new Option(w + ' × ' + h + ' ft', i)));
function setRoomSize(i){

  ROOM_W = wFt * 12; ROOM_H = hFt * 12;
  const key = presetSel.value.slice(7);
  apply(fromPreset(PRESETS[key], key));
  resize();
}
roomSizeSel.addEventListener('change', () => setRoomSize(+roomSizeSel.value));

/* ---------- 3D standpoint view ---------- */
const V3 = (() => {
  const T = window.THREE;
  const canvas = document.createElement('canvas'); canvas.id = 'view3d';
  const povLayer = document.createElement('div'); povLayer.className = 'povs';
  room.appendChild(canvas); room.appendChild(povLayer);

  // 9 standpoints: marker at (mx,my) on the wall; camera at (cx,cy) looking
  // across the room toward (lx,ly).
  function points(){
    const W = ROOM_W, H = ROOM_H, e = 18, c = 24;
    return [
      ['Door',                0, doorY+DOOR_W/2,  e, doorY+DOOR_W/2,  W, doorY+DOOR_W/2],
      ['Left wall',           0, H/2,             e, H/2,             W, H/2],
      ['Right wall',          W, H/2,             W-e, H/2,           0, H/2],
      ['Top wall',            W/2, 0,             W/2, e,             W/2, H],
      ['Bottom wall',         W/2, H,             W/2, H-e,          W/2, 0],
      ['Top-left corner',     0, 0,               c, c,              W, H],
      ['Top-right corner',    W, 0,               W-c, c,            0, H],
      ['Bottom-left corner',  0, H,               c, H-c,            W, 0],
      ['Bottom-right corner', W, H,               W-c, H-c,          0, 0],
    ].map(([label,mx,my,cx,cy,lx,ly]) => ({label,mx,my,cx,cy,lx,ly}));
  }

  const markers = points().map((p,i) => {
    const b = document.createElement('button');
    b.className = 'pov'; b.type = 'button'; b.textContent = '◉';
    b.title = 'Stand at: ' + p.label;
    b.addEventListener('click', () => select(i));
    povLayer.appendChild(b);
    return b;
  });

  let ok = !!T, ready = false, active = -1;
  let renderer, scene, camera, roomGrp, furnGrp, yaw = 0, pitch = 0, dragging = null;
  const WOOD = T && new T.MeshLambertMaterial({color:0x9A6B3B});
  const WALLM = T && new T.MeshLambertMaterial({color:0xE3E5EA});
  const GLASS = T && new T.MeshLambertMaterial({color:0xBBD4DD, transparent:true, opacity:0.28});

  function initGL(){
    renderer = new T.WebGLRenderer({canvas, antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
    renderer.setClearColor(0xE9EDF3);
    scene = new T.Scene();
    camera = new T.PerspectiveCamera(54, 1, 4, 3000);
    camera.rotation.order = 'YXZ';
    scene.add(new T.HemisphereLight(0xffffff, 0x9aa2ae, 0.62));
    const dl = new T.DirectionalLight(0xffffff, 0.42);
    dl.position.set(ROOM_W*0.3, 300, ROOM_H*0.35); dl.castShadow = true;
    dl.shadow.mapSize.set(1024,1024);
    Object.assign(dl.shadow.camera, {left:-ROOM_W, right:ROOM_W, top:ROOM_H, bottom:-ROOM_H, near:1, far:900});
    dl.shadow.camera.updateProjectionMatrix();
    scene.add(dl);
    roomGrp = new T.Group(); furnGrp = new T.Group();
    scene.add(roomGrp); scene.add(furnGrp);

    canvas.addEventListener('pointerdown', e => { dragging = {x:e.clientX, y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove', e => {
      if (!dragging) return;
      yaw   -= (e.clientX - dragging.x) * 0.005;
      pitch -= (e.clientY - dragging.y) * 0.005;
      pitch = Math.max(-1.45, Math.min(1.45, pitch));
      dragging = {x:e.clientX, y:e.clientY};
      camera.rotation.set(pitch, yaw, 0); draw();
    });
    const stop = () => dragging = null;
    canvas.addEventListener('pointerup', stop);
    canvas.addEventListener('pointercancel', stop);
    ready = true;
  }

  function box(x0,x1,y0,y1,z0,z1,mat){
    const m = new T.Mesh(new T.BoxGeometry(x1-x0, y1-y0, z1-z0), mat);
    m.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
    m.castShadow = true; m.receiveShadow = true; roomGrp.add(m);
    return m;
  }
  // wall along the Z axis (left/right walls). face = inner-face x; s = +1 solid toward -x, -1 toward +x
  function wallZ(face, s, openings){
    const th = 4, x0 = s>0 ? face-th : face, x1 = s>0 ? face : face+th;
    let cur = 0;
    openings.sort((a,b)=>a.z0-b.z0).forEach(o => {
      if (o.z0 > cur) box(x0,x1, 0,CEIL_H, cur,o.z0, WALLM);
      box(x0,x1, 0,o.y0, o.z0,o.z1, WALLM);
      box(x0,x1, o.y1,CEIL_H, o.z0,o.z1, WALLM);
      cur = o.z1;
    });
    if (cur < ROOM_H) box(x0,x1, 0,CEIL_H, cur,ROOM_H, WALLM);
  }
  // sash hinged at (hx,hz); leaf reaches |w| along +/-Z from the hinge
  function sash(hx, hz, w, sill, head, closedAng, openAng){
    const g = new T.Group(); g.position.set(hx, 0, hz);
    const aw = Math.abs(w), dir = Math.sign(w), midY = (sill+head)/2;
    const frame = new T.Mesh(new T.BoxGeometry(2, head-sill, aw-0.5), WOOD);
    frame.position.set(0, midY, dir*aw/2); frame.castShadow = true; g.add(frame);
    const pane = new T.Mesh(new T.BoxGeometry(0.6, head-sill-4, aw-4), GLASS);
    pane.position.set(0, midY, dir*aw/2); g.add(pane);
    g.rotation.y = windowsOpen ? openAng : closedAng;
    roomGrp.add(g);
  }

  function buildRoom(){
    while (roomGrp.children.length) roomGrp.remove(roomGrp.children[0]);
    // floor with 1-ft grid
    const fc = document.createElement('canvas'); fc.width = ROOM_W*3; fc.height = ROOM_H*3;
    const fx = fc.getContext('2d');
    fx.fillStyle = '#E6E0D2'; fx.fillRect(0,0,fc.width,fc.height);
    fx.strokeStyle = '#CFC6B2'; fx.lineWidth = 1;
    for (let i=0;i<=ROOM_W;i+=12){ fx.beginPath(); fx.moveTo(i*3+.5,0); fx.lineTo(i*3+.5,fc.height); fx.stroke(); }
    for (let j=0;j<=ROOM_H;j+=12){ fx.beginPath(); fx.moveTo(0,j*3+.5); fx.lineTo(fc.width,j*3+.5); fx.stroke(); }
    const floor = new T.Mesh(new T.PlaneGeometry(ROOM_W,ROOM_H),
      new T.MeshLambertMaterial({map:new T.CanvasTexture(fc)}));
    floor.rotation.x = -Math.PI/2; floor.position.set(ROOM_W/2, 0, ROOM_H/2);
    floor.receiveShadow = true; roomGrp.add(floor);
    const ceil = new T.Mesh(new T.PlaneGeometry(ROOM_W,ROOM_H), new T.MeshLambertMaterial({color:0xEFF2F6}));
    ceil.rotation.x = Math.PI/2; ceil.position.set(ROOM_W/2, CEIL_H, ROOM_H/2); roomGrp.add(ceil);

    const wt = Math.min(doorY+DOOR_W, ROOM_H-24);
    wallZ(0, 1, [
      {z0:doorY, z1:doorY+DOOR_W, y0:0, y1:DOOR_H},
      {z0:wt, z1:wt+24, y0:WIN_SILL, y1:WIN_HEAD},
    ]);
    wallZ(ROOM_W, -1, [{z0:9, z1:135, y0:WIN_SILL, y1:WIN_HEAD}]);
    box(0,ROOM_W, 0,CEIL_H, -4,0, WALLM);          // top wall
    box(0,ROOM_W, 0,CEIL_H, ROOM_H,ROOM_H+4, WALLM); // bottom wall

    // door leaf, hinged at (0, doorY), swings into room when open
    const leaf = new T.Group(); leaf.position.set(0, 0, doorY);
    const panel = new T.Mesh(new T.BoxGeometry(1.5, DOOR_H-1, DOOR_W-1), WOOD);
    panel.position.set(0, DOOR_H/2, DOOR_W/2); panel.castShadow = true;
    leaf.add(panel); leaf.rotation.y = doorOpen ? Math.PI/2 : 0; roomGrp.add(leaf);

    // window sashes: pairs meeting in the middle, 2" post between pairs
    for (const sp of windowSpecs()){
      const face = sp.wall === 'L' ? 0 : ROOM_W, into = sp.wall === 'L' ? 1 : -1;
      const len = sp.a1 - sp.a0, pairW = (len - (sp.pairs-1)*WIN_POST)/sp.pairs, sw = pairW/2;
      for (let i=0;i<sp.pairs;i++){
        const p0 = sp.a0 + i*(pairW+WIN_POST), OA = Math.PI*0.42;
        sash(face, p0,        sw, WIN_SILL, WIN_HEAD, 0, into>0 ?  OA : -OA);
        sash(face, p0+pairW, -sw, WIN_SILL, WIN_HEAD, 0, into>0 ? -OA :  OA);
        if (i < sp.pairs-1)
          box(into>0 ? face-4 : face, into>0 ? face : face+4, WIN_SILL,WIN_HEAD, p0+pairW,p0+pairW+WIN_POST, WOOD);
      }
    }
  }

  function buildFurniture(){
    while (furnGrp.children.length) furnGrp.remove(furnGrp.children[0]);
    DEFS.forEach(d => {
      const s = state[d.id]; if (!s.on) return;
      const m = s.rot % 180 === 0 ? {w:d.w, h:d.d} : {w:d.d, h:d.w};
      const geo = d.id === 'table'
        ? new T.CylinderGeometry(m.w/2, m.w/2, d.tall, 28)
        : new T.BoxGeometry(m.w, d.tall, m.h);
      const mesh = new T.Mesh(geo, new T.MeshLambertMaterial({color:d.body}));
      mesh.position.set(s.x + m.w/2, d.tall/2, s.y + m.h/2);
      mesh.castShadow = true; mesh.receiveShadow = true;
      furnGrp.add(mesh);
    });
  }

  // if a standpoint lands inside a piece (or the open door), step out the short way
  function clearSpot(x, z){
    const blocks = DEFS.filter(d => state[d.id].on).map(d => {
      const s = state[d.id], m = s.rot%180===0 ? {w:d.w,h:d.d} : {w:d.d,h:d.w};
      return {x0:s.x, x1:s.x+m.w, z0:s.y, z1:s.y+m.h};
    });
    if (doorOpen) blocks.push({x0:-14, x1:DOOR_W+8, z0:doorY-16, z1:doorY+DOOR_W+6});
    for (let n=0;n<10;n++){
      let moved = false;
      for (const b of blocks){
        if (x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1){
          const dl = x-b.x0, dr = b.x1-x, du = z-b.z0, dd = b.z1-z;
          const mn = Math.min(dl,dr,du,dd);
          if (mn===dl) x = b.x0-8; else if (mn===dr) x = b.x1+8;
          else if (mn===du) z = b.z0-8; else z = b.z1+8;
          moved = true;
        }
      }
      if (!moved) break;
    }
    return [Math.max(8, Math.min(ROOM_W-8, x)), Math.max(8, Math.min(ROOM_H-8, z))];
  }
  function stand(i){
    const p = points()[i];
    const [cx, cz] = clearSpot(p.cx, p.cy);
    camera.position.set(cx, EYE_H, cz);
    // look level across the room toward the far side; near furniture sits low in view
    camera.lookAt(p.lx, EYE_H - 3, p.ly);
    yaw = camera.rotation.y; pitch = camera.rotation.x;
    draw();
  }
  function fit(){
    const w = room.clientWidth, h = room.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    // keep a comfortable view: widen only if the viewport is portrait
    camera.fov = camera.aspect >= 1 ? 54 : Math.min(90, 54 / camera.aspect);
    camera.updateProjectionMatrix();
  }
  function draw(){ if (ready && active >= 0) renderer.render(scene, camera); }

  function select(i){
    if (!ok){ warnEl.textContent = '3D view unavailable here'; return; }
    if (active === i){ close(); return; }
    if (!ready) initGL();
    active = i;
    buildRoom(); buildFurniture(); fit();
    canvas.classList.add('on');
    markers.forEach((m,k) => m.classList.toggle('on', k === i));
    stand(i);
  }
  function close(){
    active = -1; canvas.classList.remove('on');
    markers.forEach(m => m.classList.remove('on'));
  }

  function layout(){
    for (const p of points().map((p,i)=>({p,m:markers[i]}))){
      p.m.style.left = p.p.mx*scale + 'px';
      p.m.style.top  = p.p.my*scale + 'px';
    }
    if (active >= 0 && ready){ fit(); stand(active); }
  }
  // reflect live edits
  function refresh(){ if (active >= 0 && ready){ buildRoom(); buildFurniture(); draw(); } }

  return { select, close, layout, refresh, get active(){ return active; } };
})();

const area = document.querySelector('.canvas-area');
function resize(){
  const availW = Math.max(area.clientWidth - 40, 240);
  const availH = Math.max(area.clientHeight - 40, 210);
  scale = Math.min(availW/ROOM_W, availH/ROOM_H);
  room.style.width = ROOM_W*scale+'px';
  room.style.height = ROOM_H*scale+'px';
  render();
  V3.layout();
}
new ResizeObserver(resize).observe(area);
addEventListener('resize', resize);
apply(fromPreset(PRESETS.chairtable, 'chairtable'));
resize();
</script>
</body>
